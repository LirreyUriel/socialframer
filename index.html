<html lang="en">

      const { inject } = await import('@vercel/analytics');

      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      const script = document.createElement('script');

  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body { background: #050507; }
    .sidebar-scroll {
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.16) transparent;
      -ms-overflow-style: none;
    }
    .sidebar-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .sidebar-scroll::-webkit-scrollbar-track,

      background: transparent;

      background: rgba(255,255,255,.16);

        radial-gradient(circle at 1px 1px, rgba(255,255,255,.055) 1px, transparent 0),

        radial-gradient(720px 420px at 18% 92%, var(--wash-b), transparent 55%);

      box-shadow: inset 0 0 160px rgba(0,0,0,.45);

    .ig-ring {
      background: linear-gradient(135deg, #f9ce34 0%, #ee2a7b 50%, #6228d7 100%);

      border-radius: 9999px;

    .dropzone.dragover { border-color: #93c5fd; background: rgba(147,197,253,.08); }

<body class="h-screen overflow-hidden font-sans text-zinc-100 antialiased">
  <div class="h-screen flex flex-col overflow-hidden">
    <header class="shrink-0 border-b border-white/[0.06] bg-ink-950/90 backdrop-blur-xl">

            <span class="absolute left-2 top-1 h-4 w-4 rounded-[5px] bg-pink-400/90"></span>
          </div>
          <div class="min-w-0">
            <h1 class="text-[14px] font-semibold tracking-tight">SocialPostMockup</h1>

          </div>

    <main class="flex-1 min-h-0 grid grid-rows-[minmax(0,1fr)_minmax(280px,1.05fr)] lg:grid-rows-none lg:grid-cols-[400px_minmax(0,1fr)]">
      <aside class="border-b lg:border-b-0 lg:border-r border-white/[0.06] bg-ink-900 min-h-0 flex flex-col">
        <form id="controls" class="sidebar-scroll px-6 sm:px-8 py-8 space-y-10 overflow-y-auto overflow-x-hidden flex-1" autocomplete="off">
          <section class="space-y-3.5">
            <h2 class="text-[11px] font-medium uppercase tracking-[0.18em] text-zinc-500">Platform</h2>
            <div class="grid grid-cols-3 gap-1 p-1 rounded-xl bg-black/40 ring-1 ring-white/[0.06]" role="tablist">
              <button type="button" data-platform="linkedin" title="LinkedIn" class="platform-btn h-10 rounded-lg text-[13px] font-medium">LinkedIn</button>
              <button type="button" data-platform="x" title="X (Twitter)" class="platform-btn h-10 rounded-lg text-[13px] font-medium">X</button>
              <button type="button" data-platform="instagram" title="Instagram" class="platform-btn h-10 rounded-lg text-[13px] font-medium">Instagram</button>
            </div>
          </section>

          <section class="space-y-4 pt-8 border-t border-white/[0.06]">
            <h2 class="text-[11px] font-medium uppercase tracking-[0.18em] text-zinc-500">Author</h2>
            <div class="space-y-4">
              <label class="block space-y-2">
                <span class="text-[12px] text-zinc-400">Profile name</span>
                <input id="name-input" type="text" value="Lirrey" placeholder="Lirrey"
                  class="field w-full h-11 rounded-xl bg-ink-950 px-3.5 text-sm ring-1 ring-white/10 outline-none placeholder:text-zinc-600" />
              </label>
              <label id="headline-field" class="block space-y-2">
                <span class="text-[12px] text-zinc-400">Headline / bio</span>
                <input id="headline-input" type="text" value="Building micro-SaaS in public 🚀" placeholder="Building micro-SaaS in public 🚀"
                  class="field w-full h-11 rounded-xl bg-ink-950 px-3.5 text-sm ring-1 ring-white/10 outline-none placeholder:text-zinc-600" />
              </label>
              <label id="handle-field" class="hidden space-y-2">
                <span class="text-[12px] text-zinc-400">Handle</span>
                <input id="handle-input" type="text" value="lirrey" placeholder="lirrey"
                  class="field w-full h-11 rounded-xl bg-ink-950 px-3.5 text-sm ring-1 ring-white/10 outline-none placeholder:text-zinc-600" />
              </label>
              <label class="flex items-center justify-between gap-3 rounded-xl bg-ink-950 px-3.5 h-11 ring-1 ring-white/10">
                <span class="text-sm text-zinc-300">Verified badge</span>
                <input id="verified-input" type="checkbox" checked class="h-4 w-4 accent-sky-400" />
              </label>
              <div class="space-y-2">
                <span class="text-[12px] text-zinc-400">Avatar</span>
                <div id="avatar-drop" class="dropzone flex items-center gap-3.5 rounded-xl border border-dashed border-white/15 bg-ink-950 p-3.5 cursor-pointer">
                  <img id="avatar-thumb" alt="" class="h-12 w-12 rounded-full object-cover bg-zinc-800 hidden" />
                  <div id="avatar-placeholder" class="h-12 w-12 rounded-full bg-zinc-800 grid place-items-center text-xs font-semibold text-zinc-300">L</div>
                  <div class="min-w-0 flex-1">
                    <p class="text-sm text-zinc-200">Upload a photo</p>
                    <p class="text-[11px] text-zinc-500 mt-0.5">PNG or JPG · drag & drop</p>
                  </div>
                  <button type="button" id="avatar-clear" class="hidden text-xs text-zinc-400 hover:text-zinc-200">Remove</button>
                  <button type="button" id="avatar-pick" class="text-xs font-medium text-sky-300 hover:text-sky-200">Browse</button>
                  <input id="avatar-file" type="file" accept="image/*" />
                </div>
              </div>
            </div>
          </section>

          <section class="space-y-4 pt-8 border-t border-white/[0.06]">
            <div class="flex items-center justify-between gap-3">
              <h2 class="text-[11px] font-medium uppercase tracking-[0.18em] text-zinc-500">Content</h2>
              <div id="char-meter" class="flex items-center gap-2 text-[11px] tabular-nums text-zinc-500">
                <svg id="limit-ring" class="limit-ring hidden h-5 w-5" viewBox="0 0 20 20" aria-hidden="true">
                  <circle cx="10" cy="10" r="7" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="2" />
                  <circle id="limit-arc" cx="10" cy="10" r="7" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-dasharray="44" stroke-dashoffset="44" />
                </svg>
                <span id="char-count">0</span>
              </div>
            </div>
            <label class="block space-y-2">
              <span id="text-label" class="text-[12px] text-zinc-400">Post text</span>
              <textarea id="text-input" rows="6" placeholder="Write the post you want to mock up…"
                class="field w-full resize-none rounded-xl bg-ink-950 px-3.5 py-3.5 text-sm leading-relaxed ring-1 ring-white/10 outline-none placeholder:text-zinc-600">Just shipped something I've been quietly building.

A small tool that turns any idea into a polished social post — instantly.

Would love your feedback. #buildinpublic</textarea>
            </label>
            <div class="space-y-2">
              <span class="text-[12px] text-zinc-400">Attached screenshot / image</span>
              <div id="image-drop" class="dropzone rounded-xl border border-dashed border-white/15 bg-ink-950 p-3.5 cursor-pointer">
                <div id="image-empty" class="flex items-center gap-3.5">
                  <div class="h-12 w-12 rounded-lg bg-zinc-800 grid place-items-center text-zinc-400">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="m21 15-4.5-4.5L9 18"/></svg>
                  </div>
                  <div class="min-w-0 flex-1">
                    <p class="text-sm text-zinc-200">Drop a screenshot into the post</p>
                    <p class="text-[11px] text-zinc-500 mt-0.5">PNG or JPG · drag, browse, or paste</p>

                  <button type="button" id="image-pick" class="text-xs font-medium text-sky-300 hover:text-sky-200">Browse</button>

                <div id="image-filled" class="hidden items-center gap-3.5">
                  <img id="image-thumb" alt="" class="h-14 w-20 rounded-lg object-cover bg-zinc-800" />
                  <div class="min-w-0 flex-1">
                    <p class="text-sm text-zinc-200 truncate">Screenshot attached</p>
                    <p class="text-[11px] text-zinc-500 mt-0.5">Embedded in the live preview</p>
                  </div>
                  <button type="button" id="image-clear" class="text-xs text-zinc-400 hover:text-zinc-200">Remove</button>
                </div>
                <input id="image-file" type="file" accept="image/*" />
              </div>
            </div>
          </section>
        </form>
        <div class="shrink-0 px-6 sm:px-7 py-5 border-t border-white/[0.06] bg-ink-900 space-y-3.5">
          <label class="flex items-center justify-between gap-3">
            <span class="text-[12px] text-zinc-500">Watermark on export</span>
            <input id="watermark-input" type="checkbox" checked class="toggle" aria-label="Show socialmockup.online watermark" />
          </label>
          <button type="button" id="download-btn"
            class="w-full min-h-[48px] rounded-xl bg-white text-ink-950 text-[14px] font-semibold tracking-tight shadow-glow hover:bg-zinc-100 active:scale-[.99] transition disabled:opacity-60 disabled:pointer-events-none">
            Export Pixel-Perfect PNG
          </button>
        </div>
      </aside>

      <section id="preview-stage" class="preview-stage relative min-h-0 overflow-hidden grid place-items-center px-6 py-8 sm:px-12" data-platform="linkedin">
        <div class="preview-vignette absolute inset-0"></div>
        <div id="preview-mount" class="relative w-full max-w-[540px]"></div>
      </section>
    </main>
  </div>

  <script>
    const LIMITS = { linkedin: 3000, x: 280, instagram: 2200 };
    const LINKEDIN_PREVIEW_CHARS = 210;
    const EXPORT_LABEL = 'Export Pixel-Perfect PNG';

    const state = {
      platform: 'linkedin',
      name: 'Lirrey',
      headline: 'Building micro-SaaS in public 🚀',
      handle: 'lirrey',
      verified: true,
      watermark: true,
      avatar: null,
      text: document.getElementById('text-input').value,
      image: null
    };

    const els = {
      name: document.getElementById('name-input'),
      headline: document.getElementById('headline-input'),
      headlineField: document.getElementById('headline-field'),
      handle: document.getElementById('handle-input'),
      handleField: document.getElementById('handle-field'),
      verified: document.getElementById('verified-input'),
      text: document.getElementById('text-input'),
      textLabel: document.getElementById('text-label'),
      charCount: document.getElementById('char-count'),
      limitRing: document.getElementById('limit-ring'),
      limitArc: document.getElementById('limit-arc'),
      mount: document.getElementById('preview-mount'),
      stage: document.getElementById('preview-stage'),
      download: document.getElementById('download-btn'),
      avatarFile: document.getElementById('avatar-file'),
      avatarDrop: document.getElementById('avatar-drop'),
      avatarThumb: document.getElementById('avatar-thumb'),
      avatarPlaceholder: document.getElementById('avatar-placeholder'),
      avatarClear: document.getElementById('avatar-clear'),
      imageFile: document.getElementById('image-file'),
      imageDrop: document.getElementById('image-drop'),
      imageEmpty: document.getElementById('image-empty'),
      imageFilled: document.getElementById('image-filled'),
      imageThumb: document.getElementById('image-thumb'),
      watermark: document.getElementById('watermark-input')
    };

    function escapeHtml(value) {
      return value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function initials(name) {
      return name
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0].toUpperCase())
        .join('') || 'L';
    }

    function defaultAvatarUrl(name) {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#38bdf8');
      gradient.addColorStop(1, '#818cf8');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 46px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(initials(name), size / 2, size / 2 + 1);
      return canvas.toDataURL('image/png');
    }

    function avatarSrc() {
      return state.avatar || defaultAvatarUrl(state.name);
    }

    function formatText(text, platform) {
      const color = platform === 'x' ? '#1d9bf0' : platform === 'linkedin' ? '#0A66C2' : '#00376b';
      return escapeHtml(text)
        .replace(/(https?:\/\/[^\s<]+)/g, `<span style="color:${color}">$1</span>`)
        .replace(/(^|[\s])(@[\w.]+)/g, `$1<span style="color:${color}">$2</span>`)
        .replace(/(^|[\s])(#[\w]+)/g, `$1<span style="color:${color}">$2</span>`)
        .replace(/\n/g, '<br>');
    }

    function displayHandle() {
      const raw = state.handle.trim().replace(/^@/, '');
      if (raw) return raw;
      return state.name.toLowerCase().replace(/[^a-z0-9]+/g, '') || 'lirrey';
    }

    function verifiedBadge(platform) {
      if (!state.verified) return '';
      if (platform === 'x') {
        return `<svg class="shrink-0" width="18" height="18" viewBox="0 0 22 22" aria-label="Verified"><circle cx="11" cy="11" r="10" fill="#1d9bf0"/><path d="M9.4 14.7 6.6 11.9l1.2-1.2 1.6 1.6 4.7-4.7 1.2 1.2-5.9 5.9z" fill="#fff"/></svg>`;
      }
      if (platform === 'linkedin') {
        return `<svg class="shrink-0" width="16" height="16" viewBox="0 0 16 16" aria-label="Verified"><circle cx="8" cy="8" r="8" fill="#0A66C2"/><path d="M6.7 10.7 4.6 8.6l.9-.9 1.2 1.2 3.3-3.3.9.9-4.2 4.2z" fill="#fff"/></svg>`;
      }
      return `<svg class="shrink-0" width="14" height="14" viewBox="0 0 16 16" aria-label="Verified"><circle cx="8" cy="8" r="8" fill="#3897f0"/><path d="M6.7 10.7 4.6 8.6l.9-.9 1.2 1.2 3.3-3.3.9.9-4.2 4.2z" fill="#fff"/></svg>`;
    }

    function moreIcon(color) {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="${color}"><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/></svg>`;
    }

    function actionIcon(path, color = 'currentColor') {
      return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
    }

    function linkedInIcon(paths, filled = false) {
      if (filled) {
        return `<svg width="22" height="22" viewBox="0 0 24 24" fill="#00000099">${paths}</svg>`;
      }
      return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00000099" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${paths}</svg>`;
    }

    function linkedInAction(icon, label) {
      return `<span class="h-12 flex flex-col items-center justify-center gap-0.5">${icon}<span>${label}</span></span>`;
    }

    function watermarkMarkup(tone) {
      if (!state.watermark) return '';
      const color = tone === 'dark' ? 'rgba(231,233,234,.38)' : 'rgba(0,0,0,.32)';
      return `<div class="card-watermark" style="color:${color}">socialmockup.online</div>`;
    }

    function linkedInBody() {
      if (state.text.length <= LINKEDIN_PREVIEW_CHARS) return formatText(state.text, 'linkedin');
      return `${formatText(state.text.slice(0, LINKEDIN_PREVIEW_CHARS), 'linkedin')}<span style="color:#00000099">… </span><span style="color:#0A66C2;font-weight:600">more</span>`;
    }

    function renderLinkedIn() {
      const image = state.image
        ? `<div class="px-4 pt-1 pb-2"><img src="${state.image}" alt="" class="w-full max-h-[420px] rounded-lg object-cover" style="border:1px solid #0000001a" /></div>`
        : '';
      return `
        <article id="preview-card" class="overflow-hidden rounded-xl bg-white text-[#1a1a1a] shadow-card ${state.watermark ? 'pb-6' : ''}" style="font-family:Inter,system-ui,sans-serif;background-color:#ffffff">
          <div class="px-4 pt-3.5 pb-2">
            <div class="flex items-start gap-2.5">
              <img src="${avatarSrc()}" alt="" class="h-12 w-12 rounded-full object-cover" />
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1">
                  <span class="text-[14px] font-semibold leading-6">${escapeHtml(state.name)}</span>
                  ${verifiedBadge('linkedin')}
                  <span class="text-[12px] font-semibold text-[#0A66C2]">· Follow</span>
                </div>
                <p class="text-[12px] leading-5 text-[#00000099]">${escapeHtml(state.headline)}</p>
                <p class="text-[12px] leading-5 text-[#0000008c]">1,248 followers</p>
                <p class="flex items-center gap-1 text-[12px] leading-5 text-[#0000008c]">2h · <svg width="12" height="12" viewBox="0 0 16 16" fill="#0000008c"><path d="M8 1.3A6.7 6.7 0 1 0 8 14.7 6.7 6.7 0 0 0 8 1.3Zm-.1 1.5C6.4 3 5.1 4.6 4.7 6.7h3.2V2.8ZM8.7 2.8v3.9h3.2c-.4-2.1-1.7-3.7-3.2-3.9ZM3.8 8c0-.4 0-.9.1-1.3h-2A5.3 5.3 0 0 0 3.3 11h2.2A13 13 0 0 1 3.8 8Zm1 4.7h3.1v3.8c-1.8-.3-3.3-2.2-3.7-4.5.2.3.4.5.6.7Zm4 3.8V12.7h3.1c-.4 2.3-1.9 4.2-3.7 4.5.2-.2.4-.4.6-.7ZM10.5 11H13a5.3 5.3 0 0 0 1.4-4.3h-2c.1.4.1.9.1 1.3a13 13 0 0 1-2 3ZM4.7 9.3c.3 1.4.8 2.6 1.4 3.4h3.8c.6-.8 1.1-2 1.4-3.4H4.7Z"/></svg></p>
              </div>
              ${moreIcon('#666')}
            </div>
            <p class="mt-2 text-[14px] leading-[1.4]">${linkedInBody()}</p>
          </div>
          ${image}
          <div class="px-4 py-2 flex items-center justify-between text-[12px] text-[#0000008c]">
            <span class="flex items-center gap-1.5">
              <span class="flex -space-x-1">
                <span class="h-4 w-4 rounded-full bg-[#0A66C2] ring-2 ring-white"></span>
                <span class="h-4 w-4 rounded-full bg-[#df704d] ring-2 ring-white"></span>
              </span>
              24
            </span>
            <span>8 comments · 3 reposts</span>
          </div>
          <div class="mx-4 border-t border-[#0000001a]"></div>
          <div class="grid grid-cols-4 px-1 py-1.5 text-[12px] font-semibold text-[#00000099]">
            ${linkedInAction(linkedInIcon('<path d="M7 10.8v10.2H4.6A1.6 1.6 0 0 1 3 19.4v-7A1.6 1.6 0 0 1 4.6 10.8H7z"/><path d="M7 10.8 9.4 4.2A2.3 2.3 0 0 1 11.6 2.8c.9.3 1.3 1.3 1 2.2L12 8.2h6.8a2.1 2.1 0 0 1 2.1 2.5l-1.2 6.6a2.3 2.3 0 0 1-2.3 1.9H7"/>'), 'Like')}
            ${linkedInAction(linkedInIcon('<path d="M20 6.8A2.3 2.3 0 0 0 17.7 4.5H6.3A2.3 2.3 0 0 0 4 6.8v6.7A2.3 2.3 0 0 0 6.3 15.8H8.2V19l3.8-3.2h5.7A2.3 2.3 0 0 0 20 13.5V6.8z"/><path d="M8.2 8.4h7.6M8.2 11.2h7.6M8.2 14h5"/>'), 'Comment')}
            ${linkedInAction(linkedInIcon('<path d="M4.8 9.2V6.8A1.6 1.6 0 0 1 6.4 5.2h10.6"/><path d="M14.6 3.2 17.8 5.2 14.6 7.2"/><path d="M19.2 14.8v2.4A1.6 1.6 0 0 1 17.6 18.8H7"/><path d="M9.4 20.8 6.2 18.8 9.4 16.8"/>'), 'Repost')}
            ${linkedInAction(linkedInIcon('<path d="M21.6 2.9 2.9 10.2c-.7.3-.6 1.3.1 1.5l8.1 2.2 2.2 8.1c.2.7 1.2.8 1.5.1l7.3-18.7c.3-.7-.4-1.4-1.1-1.1z"/>', true), 'Send')}
          </div>
          ${watermarkMarkup('light')}
        </article>`;
    }

    function renderX() {
      const handle = displayHandle();
      const image = state.image
        ? `<img src="${state.image}" alt="" class="mt-3 w-full max-h-[380px] rounded-2xl object-cover" style="border:1px solid #2f3336" />`
        : '';
      const meta = (icon, count, label) =>
        `<span class="flex items-center gap-1.5" title="${label}">${icon}<span>${count}</span></span>`;
      return `
        <article id="preview-card" class="overflow-hidden rounded-2xl bg-black text-[#e7e9ea] shadow-card max-w-[510px] mx-auto ${state.watermark ? 'pb-6' : ''}" style="font-family:Inter,system-ui,sans-serif;background-color:#000000;border:1px solid #2f3336">
          <div class="px-4 py-3">
            <div class="flex gap-3">
              <img src="${avatarSrc()}" alt="" class="h-10 w-10 rounded-full object-cover" />
              <div class="min-w-0 flex-1">
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0 flex flex-wrap items-center gap-x-1">
                    <span class="text-[15px] font-bold leading-6">${escapeHtml(state.name)}</span>
                    ${verifiedBadge('x')}
                    <span class="text-[15px] leading-6 text-[#71767b]">@${escapeHtml(handle)} · 2h</span>
                  </div>
                  ${moreIcon('#71767b')}
                </div>
                <p class="mt-1 text-[15px] leading-[1.35]">${formatText(state.text, 'x')}</p>
                ${image}
                <div class="mt-3 flex items-center justify-between text-[#71767b] text-[13px]">
                  ${meta(actionIcon('<path d="M21 12a8 8 0 0 1-11.3 7.3L4 21l1.8-5.5A8 8 0 1 1 21 12z"/>', '#71767b'), '12', 'Replies')}
                  ${meta(actionIcon('<path d="M7 7h8l-2-2M17 17H9l2 2"/><path d="M17 7v3a4 4 0 0 1-4 4H7M7 17v-3a4 4 0 0 1 4-4h6"/>', '#71767b'), '4', 'Retweets')}
                  ${meta(actionIcon('<path d="M12 20s-7-4.4-9.2-8.2C1 8.8 3 6 6.2 6c1.8 0 3.1 1 3.8 2 0.7-1 2-2 3.8-2C17 6 19 8.8 17.2 11.8 15 15.6 12 20 12 20z"/>', '#71767b'), '89', 'Likes')}
                  ${meta(actionIcon('<path d="M4 19V9M10 19V5M16 19v-7M22 19V8"/>', '#71767b'), '2.1K', 'Views')}
                  ${actionIcon('<path d="M12 5v10M7 9l5-5 5 5M5 19h14"/>', '#71767b')}
                </div>
              </div>
            </div>
          </div>
          ${watermarkMarkup('dark')}
        </article>`;
    }

    function renderInstagram() {
      const handle = displayHandle();
      const media = state.image
        ? `<img src="${state.image}" alt="" class="w-full aspect-[4/5] max-h-[520px] object-cover" />`
        : `<div class="aspect-[4/5] w-full bg-[#fafafa] grid place-items-center text-[#8e8e8e] text-[13px]">Add a photo to complete the post</div>`;
      return `
        <article id="preview-card" class="overflow-hidden rounded-xl bg-white text-[#262626] shadow-card max-w-[470px] mx-auto ${state.watermark ? 'pb-6' : ''}" style="font-family:Inter,system-ui,sans-serif;background-color:#ffffff;border:1px solid #00000014">
          <div class="flex items-center gap-2.5 px-3 py-2.5">
            <div class="ig-ring"><img src="${avatarSrc()}" alt="" class="h-8 w-8 rounded-full object-cover bg-white" /></div>
            <div class="min-w-0 flex-1 flex items-center gap-1">
              <span class="text-[13px] font-semibold leading-6">${escapeHtml(handle)}</span>
              ${verifiedBadge('instagram')}
            </div>
            ${moreIcon('#262626')}
          </div>
          ${media}
          <div class="px-3 pt-2.5 pb-3">
            <div class="flex items-center gap-4 text-[#262626]">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7-4.4-9.2-8.2C1 8.8 3 6 6.2 6c1.8 0 3.1 1 3.8 2 0.7-1 2-2 3.8-2C17 6 19 8.8 17.2 11.8 15 15.6 12 20 12 20z"/></svg>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-11.8 7.7L3 21l1.8-6A8.4 8.4 0 1 1 21 11.5z"/></svg>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 3 11 13"/><path d="M22 3 15 21l-4-8-8-4 19-6z"/></svg>
              <span class="ml-auto"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12a1 1 0 0 1 1 1v16l-7-4-7 4V5a1 1 0 0 1 1-1z"/></svg></span>
            </div>
            <p class="mt-2 text-[14px] font-semibold">128 likes</p>
            <p class="mt-1 text-[14px] leading-[1.4]"><span class="font-semibold mr-1">${escapeHtml(handle)}</span>${formatText(state.text, 'instagram')}</p>
            <p class="mt-1.5 text-[10px] uppercase tracking-wide text-[#8e8e8e]">2 hours ago</p>
          </div>
          ${watermarkMarkup('light')}
        </article>`;
    }

    function renderPreview() {
      const renderers = { linkedin: renderLinkedIn, x: renderX, instagram: renderInstagram };
      els.mount.innerHTML = renderers[state.platform]();
      els.stage.dataset.platform = state.platform;
    }

    function updatePlatformButtons() {
      document.querySelectorAll('.platform-btn').forEach((btn) => {
        const active = btn.dataset.platform === state.platform;
        btn.className = `platform-btn h-10 rounded-lg text-[13px] font-medium transition ${
          active ? 'bg-white text-ink-950 shadow-sm' : 'text-zinc-400 hover:text-zinc-200'
        }`;
        btn.setAttribute('aria-selected', String(active));
      });
    }

    function updatePlatformFields() {
      const isLinkedIn = state.platform === 'linkedin';
      const isX = state.platform === 'x';
      els.headlineField.classList.toggle('hidden', !isLinkedIn);
      els.headlineField.classList.toggle('block', isLinkedIn);
      els.handleField.classList.toggle('hidden', isLinkedIn);
      els.handleField.classList.toggle('block', !isLinkedIn);
      els.textLabel.textContent = isX ? 'Tweet text' : isLinkedIn ? 'Post text' : 'Caption';
      els.text.rows = isX ? 5 : 6;
      els.text.maxLength = LIMITS[state.platform];
      els.mount.className = `relative w-full ${isX ? 'max-w-[510px]' : state.platform === 'instagram' ? 'max-w-[470px]' : 'max-w-[540px]'}`;
    }

    function updateCharCount() {
      const limit = LIMITS[state.platform];
      const length = state.text.length;
      const remaining = limit - length;
      const isX = state.platform === 'x';
      els.limitRing.classList.toggle('hidden', !isX);
      if (isX) {
        const progress = Math.min(length / limit, 1);
        els.limitArc.setAttribute('stroke-dashoffset', String(44 - 44 * progress));
        els.limitArc.setAttribute('stroke', remaining <= 20 ? '#f43f5e' : remaining <= 40 ? '#f59e0b' : '#38bdf8');
        els.charCount.textContent = remaining <= 40 ? String(remaining) : `${length} / ${limit}`;
      } else {
        els.charCount.textContent = `${length} / ${limit}`;
      }
      els.charCount.className = `text-[11px] tabular-nums ${remaining < 0 || (isX && remaining <= 20) ? 'text-rose-400' : 'text-zinc-500'}`;
    }

    function syncAvatarUi() {
      els.avatarThumb.src = avatarSrc();
      els.avatarThumb.classList.remove('hidden');
      els.avatarPlaceholder.classList.add('hidden');
      els.avatarClear.classList.toggle('hidden', !state.avatar);
    }

    function syncImageUi() {
      const hasImage = Boolean(state.image);
      els.imageEmpty.classList.toggle('hidden', hasImage);
      els.imageFilled.classList.toggle('hidden', !hasImage);
      els.imageFilled.classList.toggle('flex', hasImage);
      if (hasImage) els.imageThumb.src = state.image;
    }

    function readImage(file, onLoad) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => onLoad(reader.result);
      reader.readAsDataURL(file);
    }

    function bindDropzone(zone, input, onFile) {
      ['dragenter', 'dragover'].forEach((type) => {
        zone.addEventListener(type, (event) => {
          event.preventDefault();
          event.stopPropagation();
          zone.classList.add('dragover');
        });
      });
      zone.addEventListener('dragleave', (event) => {
        if (!zone.contains(event.relatedTarget)) zone.classList.remove('dragover');
      });
      zone.addEventListener('drop', (event) => {
        event.preventDefault();
        event.stopPropagation();
        zone.classList.remove('dragover');
        readImage(event.dataTransfer.files[0], onFile);
      });
      zone.addEventListener('click', (event) => {
        if (event.target.closest('button')) return;
        input.click();
      });
      input.addEventListener('change', () => {
        readImage(input.files[0], onFile);
        input.value = '';
      });
    }

    document.querySelectorAll('.platform-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.platform = btn.dataset.platform;
        if (state.text.length > LIMITS[state.platform]) {
          state.text = state.text.slice(0, LIMITS[state.platform]);
          els.text.value = state.text;
        }
        updatePlatformButtons();
        updatePlatformFields();
        updateCharCount();
        renderPreview();
      });
    });

    els.name.addEventListener('input', () => {
      state.name = els.name.value;
      syncAvatarUi();
      renderPreview();
    });
    els.headline.addEventListener('input', () => {
      state.headline = els.headline.value;
      renderPreview();
    });
    els.handle.addEventListener('input', () => {
      state.handle = els.handle.value;
      renderPreview();
    });
    els.verified.addEventListener('change', () => {
      state.verified = els.verified.checked;
      renderPreview();
    });
    els.watermark.addEventListener('change', () => {
      state.watermark = els.watermark.checked;
      renderPreview();
    });
    els.text.addEventListener('input', () => {
      state.text = els.text.value;
      updateCharCount();
      renderPreview();
    });

    document.getElementById('avatar-pick').addEventListener('click', () => els.avatarFile.click());
    document.getElementById('image-pick').addEventListener('click', () => els.imageFile.click());
    document.getElementById('avatar-clear').addEventListener('click', (event) => {
      event.stopPropagation();
      state.avatar = null;
      syncAvatarUi();
      renderPreview();
    });
    document.getElementById('image-clear').addEventListener('click', () => {
      state.image = null;
      syncImageUi();
      renderPreview();
    });

    bindDropzone(els.avatarDrop, els.avatarFile, (data) => {
      state.avatar = data;
      syncAvatarUi();
      renderPreview();
    });
    bindDropzone(els.imageDrop, els.imageFile, (data) => {
      state.image = data;
      syncImageUi();
      renderPreview();
    });

    ['dragenter', 'dragover', 'drop'].forEach((type) => {
      document.addEventListener(type, (event) => {
        event.preventDefault();
      });
    });

    document.addEventListener('paste', (event) => {
      const item = [...(event.clipboardData?.items || [])].find((entry) => entry.type.startsWith('image/'));
      if (!item) return;
      event.preventDefault();
      readImage(item.getAsFile(), (data) => {
        state.image = data;
        syncImageUi();
        renderPreview();
      });
    });

    function waitForImages(root) {
      return Promise.all([...root.querySelectorAll('img')].map((img) => {
        if (img.complete) return Promise.resolve();
        return new Promise((resolve) => {
          img.onload = img.onerror = () => resolve();
        });
      }));
    }

    els.download.addEventListener('click', async () => {
      const card = document.getElementById('preview-card');
      if (!card || !window.htmlToImage) return;
      els.download.disabled = true;
      els.download.textContent = 'Exporting…';
      try {
        if (document.fonts?.ready) await document.fonts.ready;
        await waitForImages(card);
        const backgroundColor = state.platform === 'x' ? '#000000' : '#ffffff';
        const dataUrl = await htmlToImage.toPng(card, {
          pixelRatio: 3,
          cacheBust: true,
          backgroundColor,
          skipFonts: false
        });
        const link = document.createElement('a');
        link.download = `socialpost-${state.platform}.png`;
        link.href = dataUrl;
        link.click();
      } catch (error) {
        console.error(error);
        els.download.textContent = 'Export failed — try again';
        await new Promise((resolve) => setTimeout(resolve, 1600));
      } finally {
        els.download.disabled = false;
        els.download.textContent = EXPORT_LABEL;
      }
    });

    const requested = new URLSearchParams(location.search).get('platform');
    if (requested && LIMITS[requested]) state.platform = requested;

    updatePlatformButtons();
    updatePlatformFields();
    updateCharCount();
    syncAvatarUi();
    syncImageUi();
    renderPreview();
  </script>
</body>
</html>
